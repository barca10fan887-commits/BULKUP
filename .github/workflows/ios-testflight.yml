# Builds the native iOS app in the cloud (no Mac needed) and uploads it to
# App Store Connect / TestFlight. Run it from the Actions tab ("Run workflow").
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID                    10-character Team ID from developer.apple.com > Membership
#   APP_STORE_CONNECT_KEY_ID         App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID      App Store Connect API issuer ID
#   APP_STORE_CONNECT_KEY_P8         Full contents of the downloaded AuthKey_XXXX.p8 file
# Required repository variable:
#   APP_BUNDLE_ID                    e.g. com.yourname.bulkup (must match the app in App Store Connect)
# Optional variables: VITE_API_BASE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
name: iOS build to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version shown in the App Store (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=""
          [ -z "${{ secrets.APPLE_TEAM_ID }}" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "${{ secrets.APP_STORE_CONNECT_KEY_P8 }}" ] && missing="$missing APP_STORE_CONNECT_KEY_P8"
          [ -z "$APP_BUNDLE_ID" ] && missing="$missing APP_BUNDLE_ID(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing. See docs/APP_STORE.md"; exit 1; fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build web app for iOS
        run: npm run build:native
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Write App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.APP_STORE_CONNECT_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/BULKUP.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to App Store Connect
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/${{ secrets.APPLE_TEAM_ID }}/" ios/export/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BULKUP.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Done
        run: echo "Build ${{ inputs.version }} (${{ github.run_number }}) uploaded. It appears in TestFlight after Apple finishes processing (usually 10-30 minutes)."

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
